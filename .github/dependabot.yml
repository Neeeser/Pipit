version: 2

# Swift packages are absent on purpose. Speech dependencies are pinned to
# measured versions, and a version change requires a benchmark run, so an
# automatic bump would land an unmeasured model path.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
