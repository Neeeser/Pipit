name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Every swift build and the test run compile with -warnings-as-errors.
      # scripts/spm-env.sh reads this variable. A local build leaves it unset.
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # The packaging step below stamps the commit count as the build
          # number, and the default depth of 1 would make it 1. The other jobs
          # here build no bundle and keep the shallow checkout.
          fetch-depth: 0

      - name: Select the newest Xcode on the image
        id: toolchain
        # The SpeechAnalyzer backend needs the macOS 26 SDK to compile in.
        # The code carries its own compile gate, so an image without a new
        # enough Xcode still builds; it just builds without the Apple engine,
        # and a release from such a toolchain would ship without it too.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $newest"
          sudo xcode-select -s "$newest"
          echo "xcode=$(xcodebuild -version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SwiftPM build directory
        # .build holds the dependency checkouts, the build artifacts and both
        # configurations, so nothing is excluded. It runs a few gigabytes.
        # GitHub evicts by age under the 10 GB repository limit, and a change
        # to Package.resolved or Package.swift moves the key onto a fresh
        # entry that the restore-keys prefix still warms from the last one.
        #
        # PIPIT_WARNINGS_AS_ERRORS adds -Xswiftc -warnings-as-errors, and an
        # object compiled without that flag is reused as compiled. That is
        # fine here: this job sets the flag on every build, so a cache written
        # by it was compiled with the gate on.
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Install SwiftLint and XcodeGen
        run: brew install swiftlint xcodegen

      - name: Show toolchain
        # Printed before the first build so a red Lint or Build step can be
        # read against the exact tool versions that produced it.
        run: |
          swift --version
          xcodebuild -version || true
          swift format --version
          swiftlint version
          xcodegen --version

      - name: Lint
        # Style and defect rules. It fails on any file that has not been run
        # through scripts/format.sh, and on a SwiftLint error.
        run: ./scripts/lint.sh

      - name: Check the Xcode project matches project.yml
        # project.yml is the source. A hand edit in Xcode that is not mirrored
        # there is lost on the next generate, so the job fails on a difference.
        #
        # XcodeGen names the local package reference after the checkout
        # directory and derives its identifier from that name, so a clone not
        # named Pipit differs on those two lines alone. Both sides get that
        # name and identifier replaced with fixed text before the comparison.
        run: |
          committed="$(mktemp)"
          git show HEAD:Pipit.xcodeproj/project.pbxproj >"$committed"
          xcodegen generate
          normalise() {
            id="$(sed -n -E 's/^[[:space:]]*([0-9A-F]{24}) .*lastKnownFileType = folder; name = [^;]*; path = \.; sourceTree = SOURCE_ROOT.*/\1/p' "$1" | head -1)"
            if [ -z "$id" ]; then
              cat "$1"
              return
            fi
            # The section is sorted by identifier, so the two lines move as
            # well as change. They are cut out and appended in a fixed form,
            # which keeps their remaining text under the comparison.
            grep -v "$id" "$1"
            grep "$id" "$1" | sed -E \
              -e 's#^[[:space:]]*[0-9A-F]{24} /\* [^*]* \*/#package reference#' \
              -e 's/(name = )[^;]*;/\1PACKAGE;/'
          }
          diff -u <(normalise "$committed") <(normalise Pipit.xcodeproj/project.pbxproj)

      - name: Build (debug)
        run: ./scripts/build.sh debug

      - name: Build the Xcode project
        # The shell a contributor opens. It compiles Sources/PipitApp against
        # the package products and assembles the bundle Xcode runs.
        run: |
          xcodebuild -project Pipit.xcodeproj -scheme Pipit \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Run the test suite
        # Live OpenAI tests are skipped here: they need a key, and CI must not
        # spend money or depend on a network service.
        run: ./scripts/test.sh --enable-code-coverage

      - name: Report code coverage
        # Informational only. There is no threshold and a missing profile does
        # not fail the job.
        run: |
          profdata=.build/debug/codecov/default.profdata
          binary="$(ls -d .build/debug/*.xctest/Contents/MacOS/* 2>/dev/null | head -1)"
          if [ ! -f "$profdata" ] || [ -z "$binary" ]; then
            echo "coverage: no profile or test binary found, skipping the report"
            exit 0
          fi
          xcrun llvm-cov report "$binary" \
            -instr-profile "$profdata" \
            -ignore-filename-regex '(\.build|Tests/|CWebRTCAEC3)' \
            || echo "coverage: llvm-cov report failed"

      - name: Build (release)
        run: ./scripts/build.sh release

      - name: Package the app
        # Ad-hoc signing only. A Developer ID build happens in the release
        # workflow, where the signing secrets live.
        run: ./scripts/bundle-app.sh release

      - name: Verify the bundle
        run: |
          test -x dist/Pipit.app/Contents/MacOS/Pipit
          test -x dist/Pipit.app/Contents/MacOS/pipit-nativehost
          test -f dist/Pipit.app/Contents/Resources/extension/firefox/manifest.json
          test -f dist/Pipit.app/Contents/Resources/Pipit.icns
          for state in idle recording paused warning; do
            test -f "dist/Pipit.app/Contents/Resources/pipit-$state.png"
            test -f "dist/Pipit.app/Contents/Resources/pipit-$state@2x.png"
          done
          codesign --verify --verbose=1 dist/Pipit.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/Pipit.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/Pipit.app/Contents/Info.plist)" = "Pipit.icns"

  extension:
    name: Browser extension
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the extension dev dependencies
        # npm ci installs exactly what extension/package-lock.json pins.
        working-directory: extension
        run: npm ci
      - name: Lint the sensor
        working-directory: extension
        run: npm run lint
      - name: Test the sensor logic
        working-directory: extension
        run: npm test
      - name: Build the extension bundles
        run: ./extension/build.sh
      - name: Check the manifests parse
        run: |
          for browser in firefox chrome; do
            node -e "JSON.parse(require('fs').readFileSync('extension/dist/$browser/manifest.json','utf8'))"
          done

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Investigation material stays untracked
        run: |
          if git ls-files --error-unmatch plans probes >/dev/null 2>&1; then
            echo "plans/ or probes/ is tracked; they are local working material" >&2
            exit 1
          fi

      - name: No API keys in the tree
        run: |
          # A committed OpenAI key is an immediate incident, so CI fails on the
          # shape of one rather than waiting for a review to catch it.
          if git grep -nIE 'sk-(proj-)?[A-Za-z0-9_-]{32,}'; then
            echo "possible API key committed" >&2
            exit 1
          fi

      - name: No meeting content in fixtures
        run: |
          if git ls-files | grep -E '\.(caf|wav|m4a|mp3|aiff|aif|mp4|mov)$'; then
            echo "audio files must not be committed" >&2
            exit 1
          fi
