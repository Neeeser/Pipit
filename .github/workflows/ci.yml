name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Build a signed and notarized test app without a release or tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.notarize && 'notarized' || 'verify' }}
  cancel-in-progress: true

jobs:
  # Pull requests run the fast tests always and the slow suites (tagged .slow,
  # see scripts/slow-suites.sh) only when a change can reach them. A push to
  # main and a manual run always run both. The jobs below run side by side and
  # "Build and test" at the end reports their combined result under the one
  # name that the main ruleset and the release workflow look for.
  changes:
    name: Choose the test set
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.pick.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the slow suites run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            slow="$(git diff --name-only "$BASE_SHA"...HEAD | ./scripts/needs-slow-tests.sh)"
          else
            slow=true
          fi
          echo "slow suites: $slow"
          echo "slow=$slow" >> "$GITHUB_OUTPUT"

  fast-tests:
    name: Lint and fast tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Every swift build and the test run compile with -warnings-as-errors.
      # scripts/spm-env.sh reads this variable. A local build leaves it unset.
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Show toolchain
        # Printed before the first build so a red Lint or test step can be
        # read against the exact tool versions that produced it.
        run: |
          swift --version
          xcodebuild -version || true
          swift format --version
          swiftlint version

      - name: Lint
        # Style and defect rules. It fails on any file that has not been run
        # through scripts/format.sh, and on a SwiftLint error.
        run: ./scripts/lint.sh

      - name: Run the fast tests
        # Everything except the suites tagged .slow. This is the only debug
        # build of the package in the workflow besides the slow job's. Live
        # OpenAI tests are skipped here: they need a key, and CI must not spend
        # money or depend on a network service.
        run: ./scripts/test.sh --fast

  slow-tests:
    name: Slow tests
    needs: changes
    if: ${{ needs.changes.outputs.slow == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Run the slow tests
        # The suites tagged .slow run the echo canceller and the processing
        # pipeline over seconds of speech, and take most of a full run.
        run: ./scripts/test.sh --slow

  xcode-project:
    name: Xcode project
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check the Xcode project matches project.yml
        # project.yml is the source. A hand edit in Xcode that is not mirrored
        # there is lost on the next generate, so the job fails on a difference.
        #
        # XcodeGen names the local package reference after the checkout
        # directory and derives its identifier from that name, so a clone not
        # named Pipit differs on those two lines alone. Both sides get that
        # name and identifier replaced with fixed text before the comparison.
        run: |
          committed="$(mktemp)"
          git show HEAD:Pipit.xcodeproj/project.pbxproj >"$committed"
          xcodegen generate
          normalise() {
            id="$(sed -n -E 's/^[[:space:]]*([0-9A-F]{24}) .*lastKnownFileType = folder; name = [^;]*; path = \.; sourceTree = SOURCE_ROOT.*/\1/p' "$1" | head -1)"
            if [ -z "$id" ]; then
              cat "$1"
              return
            fi
            # The section is sorted by identifier, so the two lines move as
            # well as change. They are cut out and appended in a fixed form,
            # which keeps their remaining text under the comparison.
            grep -v "$id" "$1"
            grep "$id" "$1" | sed -E \
              -e 's#^[[:space:]]*[0-9A-F]{24} /\* [^*]* \*/#package reference#' \
              -e 's/(name = )[^;]*;/\1PACKAGE;/'
          }
          diff -u <(normalise "$committed") <(normalise Pipit.xcodeproj/project.pbxproj)

      - name: Build the Xcode project
        # The shell a contributor opens. It compiles Sources/PipitApp against
        # the package products and assembles the bundle Xcode runs.
        run: |
          xcodebuild -project Pipit.xcodeproj -scheme Pipit \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

  package:
    name: Package the app
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # The packaging step stamps the commit count as the build number,
          # and the default depth of 1 would make it 1.
          fetch-depth: 0

      - uses: ./.github/actions/select-xcode

      - name: Package the app
        # Ad-hoc signing only. A Developer ID build happens in the release
        # workflow, where the signing secrets live. This builds the release
        # products itself; nothing builds them before it.
        run: ./scripts/bundle-app.sh release

      - name: Verify the bundle
        run: |
          test -x dist/Pipit.app/Contents/MacOS/Pipit
          test -x dist/Pipit.app/Contents/MacOS/pipit-nativehost
          test -x dist/Pipit.app/Contents/MacOS/pipit-cli
          test -f dist/Pipit.app/Contents/Resources/skills/pipit/SKILL.md
          test -f dist/Pipit.app/Contents/Resources/extension/firefox/manifest.json
          test -f dist/Pipit.app/Contents/Resources/extension/chrome/manifest.json
          test -x dist/Pipit.app/Contents/PlugIns/PipitSafariExtension.appex/Contents/MacOS/PipitSafariExtension
          test -f dist/Pipit.app/Contents/PlugIns/PipitSafariExtension.appex/Contents/Resources/manifest.json
          codesign --verify --verbose=1 dist/Pipit.app/Contents/PlugIns/PipitSafariExtension.appex
          test -f dist/Pipit.app/Contents/Resources/Pipit.icns
          test -f dist/Pipit.app/Contents/Resources/EchoModels/localvqe-v1.4-aec-2.7K-f32.gguf
          test -f dist/Pipit.app/Contents/Resources/EchoModels/dtln-aec-512.weights
          for state in idle recording paused warning; do
            test -f "dist/Pipit.app/Contents/Resources/pipit-$state.png"
            test -f "dist/Pipit.app/Contents/Resources/pipit-$state@2x.png"
          done
          codesign --verify --verbose=1 dist/Pipit.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/Pipit.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/Pipit.app/Contents/Info.plist)" = "Pipit.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :PipitGitCommit' dist/Pipit.app/Contents/Info.plist)" = "$(git rev-parse HEAD)"

      - name: Archive and check the debug symbols
        # The release workflow attaches these to every release. Running the
        # same script here means a change that leaves a release without
        # symbols that match its binaries fails on the pull request instead.
        run: ./scripts/archive-dsyms.sh

  build-and-test:
    name: Build and test
    # Reports the jobs above under the name the main ruleset requires and the
    # release workflow reads. The slow suites may be skipped on a pull request
    # that cannot reach them; every other run needs them to have passed.
    needs: [changes, fast-tests, slow-tests, xcode-project, package]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast-tests.result }}
          SLOW: ${{ needs.slow-tests.result }}
          XCODE: ${{ needs.xcode-project.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "changes=$CHANGES fast=$FAST slow=$SLOW xcode=$XCODE package=$PACKAGE"
          for result in "$CHANGES" "$FAST" "$XCODE" "$PACKAGE"; do
            [ "$result" = success ] || { echo "a required job did not pass" >&2; exit 1; }
          done
          if [ "$SLOW" = success ]; then
            exit 0
          fi
          if [ "$SLOW" = skipped ] && [ "$EVENT" = pull_request ]; then
            echo "the slow suites were skipped: the change cannot reach them"
            exit 0
          fi
          echo "the slow suites did not pass" >&2
          exit 1

  notarized-test:
    name: Notarized test app
    if: github.event_name == 'workflow_dispatch' && inputs.notarize
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Import the Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-signing-identity.sh

      - name: Build the signed test app
        env:
          PIPIT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PIPIT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PIPIT_RELEASE: '1'
        run: ./scripts/bundle-app.sh release

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize.sh dist/Pipit.app

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Archive the notarized app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pipit.app dist/Pipit-notarized.zip

      - name: Upload the test app
        uses: actions/upload-artifact@v7
        with:
          name: Pipit-notarized-${{ github.sha }}
          path: dist/Pipit-notarized.zip
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the extension dev dependencies
        # npm ci installs exactly what extension/package-lock.json pins.
        working-directory: extension
        run: npm ci
      - name: Lint the sensor
        working-directory: extension
        run: npm run lint
      - name: Test the sensor logic
        working-directory: extension
        run: npm test
      - name: Build the extension bundles
        run: ./extension/build.sh
      - name: Check the manifests parse
        run: |
          for browser in firefox chrome safari; do
            node -e "JSON.parse(require('fs').readFileSync('extension/dist/$browser/manifest.json','utf8'))"
          done

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Investigation material stays untracked
        run: |
          if git ls-files --error-unmatch plans probes >/dev/null 2>&1; then
            echo "plans/ or probes/ is tracked; they are local working material" >&2
            exit 1
          fi

      - name: No API keys in the tree
        run: |
          # A committed OpenAI key is an immediate incident, so CI fails on the
          # shape of one rather than waiting for a review to catch it.
          if git grep -nIE 'sk-(proj-)?[A-Za-z0-9_-]{32,}'; then
            echo "possible API key committed" >&2
            exit 1
          fi

      - name: No meeting content in fixtures
        run: |
          if git ls-files | grep -E '\.(caf|wav|m4a|mp3|aiff|aif|mp4|mov)$'; then
            echo "audio files must not be committed" >&2
            exit 1
          fi
