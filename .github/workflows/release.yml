name: Release

# A release pull request raises VERSION and adds the version's notes to
# CHANGELOG.md (scripts/prepare-release.sh opens it). Once CI passes on the
# commit that merge puts on main, this workflow finds a VERSION with no tag yet,
# builds it, tags that commit and drafts the GitHub release. Nothing is pushed
# to main. See docs/RELEASING.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The fallback: a tag pushed by hand onto a commit whose VERSION matches it.
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Find an unreleased version
    # A CI run started by hand on main (the notarized test app) is not a merge
    # and releases nothing.
    if: >-
      github.event_name == 'push'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.find.outputs.release }}
      version: ${{ steps.find.outputs.version }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
      tag_push: ${{ steps.find.outputs.tag_push }}
      prerelease: ${{ steps.find.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compare VERSION with the tags
        id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$EVENT_NAME" = "push" ]; then
            TAG_PUSH=true
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "tag $REF_NAME does not match VERSION $VERSION on the commit it names" >&2
              exit 1
            fi
          else
            TAG_PUSH=false
            # Every merge after a release lands here with the tag already
            # there, which is the usual case and not an error.
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "$TAG already exists; nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Fails when CHANGELOG.md has no section for this version, before a
          # macOS runner is spent on a build that would ship without notes.
          ./scripts/release-notes.sh "$VERSION" >/dev/null
          # Below 1.0.0 the release is a pre-release, so the appcast item lands
          # on the beta channel. From 1.0.0 on, tick the pre-release box on the
          # draft before publishing to send a release to the beta channel.
          PRERELEASE=false
          if [ "${VERSION%%.*}" = "0" ]; then
            PRERELEASE=true
          fi
          echo "releasing $TAG from $SHA"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "tag_push=$TAG_PUSH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          # The build number is the commit count, and the default depth of 1
          # would make every release build number 1.
          fetch-depth: 0

      - name: Select the newest Xcode on the image
        id: toolchain
        # A release built without the macOS 26 SDK ships without the Apple
        # speech engine: the compile gate keeps such a build correct, but the
        # newest toolchain is what keeps the engine in the product.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $newest"
          sudo xcode-select -s "$newest"
          echo "xcode=$(xcodebuild -version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SwiftPM build directory
        # Shares the key shape with ci.yml, so a release warms from whatever
        # CI last wrote for this toolchain and resolved dependency set. .build
        # holds the checkouts, the artifacts and both configurations, so
        # nothing is excluded. It runs a few gigabytes, and GitHub evicts by
        # age under the 10 GB repository limit. A change to Package.resolved
        # or Package.swift moves the key onto a fresh entry, which the
        # restore-keys prefix still warms from the last one.
        #
        # This job does not set PIPIT_WARNINGS_AS_ERRORS, and a cached object
        # is reused as compiled rather than rebuilt under a different flag.
        # The gate still holds: ci.yml builds the same tree with the flag on
        # every commit, so a warning never reaches a release untested.
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Install create-dmg
        # create-dmg lays out the installer window in scripts/package.sh.
        run: brew install create-dmg

      - name: Check the update signing key
        # Sparkle refuses an update whose archive is unsigned, and the archive
        # is signed against the public key inside the app. A release built with
        # the placeholder ships a copy that can never update itself.
        run: |
          KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" App/Info.plist 2>/dev/null || true)"
          if [ -z "$KEY" ] || [ "$KEY" = "REPLACE_WITH_PUBLIC_KEY" ]; then
            echo "App/Info.plist still carries the placeholder SUPublicEDKey. Generate the EdDSA key pair and set the real public key before tagging a release. See docs/RELEASING.md." >&2
            exit 1
          fi

      - name: Look for a passing CI run on this commit
        id: ci
        # The gate is the CI run on main, which tests every commit before it
        # lands. When that run already passed on this exact commit, the test
        # step below repeats it and costs the job around half an hour, so it
        # is skipped. The name must match the job name in ci.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if gh api "repos/${{ github.repository }}/commits/${{ needs.check.outputs.sha }}/check-runs" \
            --jq '.check_runs[] | select(.name == "Build and test" and .conclusion == "success") | .name' \
            | grep -q .; then
            tested=true
          fi
          echo "CI tested this commit: $tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Test before packaging
        # Only reached when no passing CI run exists for this commit, which in
        # practice means a tag pushed by hand onto an untested commit.
        if: steps.ci.outputs.tested != 'true'
        run: ./scripts/test.sh

      - name: Import the Developer ID certificate
        # Absent secrets are not a failure: the build still produces an ad-hoc
        # signed app, clearly marked as unsigned in the release notes.
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID certificate configured; building ad-hoc signed."
            exit 0
          fi
          ./scripts/import-signing-identity.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sign the Firefox add-on
        # Absent credentials are not a failure: the app then ships without the
        # add-on and walks the user through about:debugging instead. Signing
        # that starts and fails is a failure, because a release that quietly
        # loses one-click install looks fine and is not.
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::No AMO credentials configured; shipping without the signed add-on."
            exit 0
          fi
          # Mozilla signs each add-on version once and refuses a repeat, so a
          # second run of the same release would fail here. The run number
          # makes every submission distinct while the app version stays the
          # first three parts. Firefox accepts up to four numeric parts.
          ./scripts/sign-extension.sh "$VERSION.$GITHUB_RUN_NUMBER"

      - name: Build the app
        # PIPIT_RELEASE asks scripts/app-version.sh for the plain version from
        # VERSION. Without it the bundle would read <VERSION>-dev.<short sha>,
        # which is what every other build carries. The build number comes from
        # the commit count and needs nothing here. PIPIT_TEAM_ID prefixes the
        # app group the Safari extension shares with the app.
        env:
          PIPIT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PIPIT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PIPIT_RELEASE: '1'
        run: ./scripts/bundle-app.sh release

      - name: Archive the debug symbols
        # A crash report from another Mac names frames by image and offset.
        # Only the dSYMs of this exact build turn them into functions and
        # lines, and the object files they are made from are gone once the
        # runner is. The script fails if they do not match the bundled
        # binaries or do not resolve to source lines.
        run: ./scripts/archive-dsyms.sh ${{ needs.check.outputs.version }}

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize.sh dist/Pipit.app

      - name: Package
        run: ./scripts/package.sh ${{ needs.check.outputs.version }}

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Write the release notes
        # The version's section of CHANGELOG.md, then the marker the update
        # window stops reading at. GitHub appends the pull request list it
        # generates after this body, so contributors are credited on the
        # release page without that list showing in the app.
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          ./scripts/release-notes.sh "$VERSION" > dist/release-body.md
          if [ "$SIGNED" != "true" ]; then
            printf '\n**Unsigned build.** Gatekeeper refuses it. Do not publish. See docs/RELEASING.md.\n' >> dist/release-body.md
          fi

      - name: Tag the release
        # The build has already signed, notarized and packaged, so the tag only
        # ever names a commit that produced a release. That commit is the one
        # the release pull request's merge put on main, which is why the
        # release step needs no target_commitish. A tag push run skips this
        # step, because its tag already exists.
        if: needs.check.outputs.tag_push != 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      - name: Publish the release
        # Pinned to a commit: this job holds the signing identity while it runs.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The signed add-on rides along so the Firefox update feed can point
          # at it. Absent when no AMO credentials were configured, which the
          # signing step already warned about.
          files: |
            dist/Pipit-${{ needs.check.outputs.version }}.zip
            dist/Pipit.dmg
            dist/Pipit-${{ needs.check.outputs.version }}.sha256
            dist/Pipit-${{ needs.check.outputs.version }}-dSYMs.zip
            extension/signed/pipit-sensor.xpi
          tag_name: ${{ needs.check.outputs.tag }}
          draft: true
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          # GitHub appends the notes it generates from merged pull requests
          # after this body.
          generate_release_notes: true
          body_path: dist/release-body.md
