name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      level:
        description: 'Bump VERSION by this much and tag the result'
        type: choice
        default: none
        options: [none, patch, minor, major]
      version:
        description: 'Version to build, without the leading v. Leave empty when a level is given'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release, which puts the appcast item on the beta channel. A version below 1.0.0 is a pre-release either way'
        type: boolean
        default: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode on the image
        # A release built without the macOS 26 SDK ships without the Apple
        # speech engine: the compile gate keeps such a build correct, but the
        # newest toolchain is what keeps the engine in the product.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $newest"
          sudo xcode-select -s "$newest"

      - name: Resolve the version
        id: version
        # A manual run takes either a bump level or an explicit version. The
        # level route reads VERSION and raises it. The version route names the
        # number outright, which is how the first release is cut. A tag push
        # takes the version from the tag.
        env:
          # Passed through the environment and validated, never interpolated into
          # the script body.
          INPUT_LEVEL: ${{ inputs.level }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BUMP=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LEVEL="$INPUT_LEVEL"
            if [ "$LEVEL" = "none" ]; then
              LEVEL=""
            fi
            if [ -n "$LEVEL" ] && [ -n "$INPUT_VERSION" ]; then
              echo "give a bump level or a version, not both" >&2
              exit 1
            fi
            if [ -z "$LEVEL" ] && [ -z "$INPUT_VERSION" ]; then
              echo "give a bump level or a version" >&2
              exit 1
            fi
            if [ -n "$LEVEL" ]; then
              VERSION="$(./scripts/bump-version.sh "$LEVEL")"
              BUMP=true
            else
              VERSION="$INPUT_VERSION"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            *[!0-9.]*|"") echo "version must be numeric, got: $VERSION" >&2; exit 1 ;;
          esac
          # Below 1.0.0 the release is a pre-release whatever the box says, so
          # the appcast item lands on the beta channel.
          PRERELEASE=false
          if [ "${VERSION%%.*}" = "0" ] || [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "bump=$BUMP"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION

      - name: Check the update signing key
        # Sparkle refuses an update whose archive is unsigned, and the archive
        # is signed against the public key inside the app. A release built with
        # the placeholder ships a copy that can never update itself.
        run: |
          KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" App/Info.plist 2>/dev/null || true)"
          if [ -z "$KEY" ] || [ "$KEY" = "REPLACE_WITH_PUBLIC_KEY" ]; then
            echo "App/Info.plist still carries the placeholder SUPublicEDKey. Generate the EdDSA key pair and set the real public key before tagging a release. See docs/RELEASING.md." >&2
            exit 1
          fi

      - name: Test before packaging
        # The gate is the CI run on main, which tests every commit before it
        # lands. This step only catches a tag placed on a commit that never went
        # through it. It rebuilds the dependencies in debug and costs the job
        # around half an hour.
        run: ./scripts/test.sh

      - name: Commit and tag the version bump
        # The level route owns the version commit. It lands on the branch the
        # run was started from, which has to be the default branch, and the tag
        # goes on that commit so the release describes the tree that was built.
        # A push made with GITHUB_TOKEN does not start ci.yml. That is
        # acceptable here. This tree is the tested main plus one line in
        # VERSION, and the test step above ran against it.
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "a bump level run belongs on $DEFAULT_BRANCH, not $BRANCH" >&2
            exit 1
          fi
          if [ "$(git show "HEAD:VERSION" | tr -d '[:space:]')" = "$VERSION" ]; then
            echo "VERSION already reads $VERSION; run with an explicit version to rebuild it" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git commit -m "Release $VERSION"
          git tag "$TAG"
          git push origin "HEAD:$BRANCH"
          git push origin "$TAG"

      - name: Import the Developer ID certificate
        # Absent secrets are not a failure: the build still produces an ad-hoc
        # signed app, clearly marked as unsigned in the release notes.
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID certificate configured; building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "certificate imported but no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sign the Firefox add-on
        # Absent credentials are not a failure: the app then ships without the
        # add-on and walks the user through about:debugging instead. Signing
        # that starts and fails is a failure, because a release that quietly
        # loses one-click install looks fine and is not.
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::No AMO credentials configured; shipping without the signed add-on."
            exit 0
          fi
          ./scripts/sign-extension.sh "$VERSION"

      - name: Build the app
        env:
          PIPIT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PIPIT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/bundle-app.sh release

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize.sh dist/Pipit.app

      - name: Package
        run: ./scripts/package.sh ${{ steps.version.outputs.version }}

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Publish the release
        # Pinned to a commit: this job holds the signing identity while it runs.
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/Pipit-${{ steps.version.outputs.version }}.zip
            dist/Pipit-${{ steps.version.outputs.version }}.dmg
            dist/Pipit-${{ steps.version.outputs.version }}.sha256
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          # GitHub appends the notes it generates from merged pull requests
          # after this body.
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.signed == 'true' && 'Signed with Developer ID and notarized.' || '**Unsigned build.** Gatekeeper will refuse to open it normally. Do not publish this as a public release. See docs/RELEASING.md.' }}

            Install Pipit by opening `Pipit-${{ steps.version.outputs.version }}.dmg` and dragging the app to Applications.
