name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      level:
        description: 'Bump VERSION by this much and tag the result'
        type: choice
        default: none
        options: [none, patch, minor, major]
      version:
        description: 'Version to build, without the leading v. Leave empty when a level is given'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release, which puts the appcast item on the beta channel. A version below 1.0.0 is a pre-release either way'
        type: boolean
        default: false
      notes:
        description: "Release notes, one or two lines. Leave empty to write them on the draft."
        required: false
        type: string

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, and the default depth of 1
          # would make every release build number 1.
          fetch-depth: 0

      - name: Select the newest Xcode on the image
        id: toolchain
        # A release built without the macOS 26 SDK ships without the Apple
        # speech engine: the compile gate keeps such a build correct, but the
        # newest toolchain is what keeps the engine in the product.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $newest"
          sudo xcode-select -s "$newest"
          echo "xcode=$(xcodebuild -version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SwiftPM build directory
        # Shares the key shape with ci.yml, so a release warms from whatever
        # CI last wrote for this toolchain and resolved dependency set. .build
        # holds the checkouts, the artifacts and both configurations, so
        # nothing is excluded. It runs a few gigabytes, and GitHub evicts by
        # age under the 10 GB repository limit. A change to Package.resolved
        # or Package.swift moves the key onto a fresh entry, which the
        # restore-keys prefix still warms from the last one.
        #
        # This job does not set PIPIT_WARNINGS_AS_ERRORS, and a cached object
        # is reused as compiled rather than rebuilt under a different flag.
        # The gate still holds: ci.yml builds the same tree with the flag on
        # every commit, so a warning never reaches a release untested.
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Resolve the version
        id: version
        # A manual run takes either a bump level or an explicit version. The
        # level route reads VERSION and raises it. The version route names the
        # number outright, which is how the first release is cut. A tag push
        # takes the version from the tag. Both manual routes end the same way:
        # the version goes into the tree, the build runs, and the commit and
        # the tag are pushed once it has succeeded.
        env:
          # Passed through the environment and validated, never interpolated into
          # the script body.
          INPUT_LEVEL: ${{ inputs.level }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG_PUSH=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
              echo "a release run belongs on $DEFAULT_BRANCH, not $BRANCH" >&2
              exit 1
            fi
            LEVEL="$INPUT_LEVEL"
            if [ "$LEVEL" = "none" ]; then
              LEVEL=""
            fi
            if [ -n "$LEVEL" ] && [ -n "$INPUT_VERSION" ]; then
              echo "give a bump level or a version, not both" >&2
              exit 1
            fi
            if [ -z "$LEVEL" ] && [ -z "$INPUT_VERSION" ]; then
              echo "give a bump level or a version" >&2
              exit 1
            fi
            if [ -n "$LEVEL" ]; then
              VERSION="$(./scripts/bump-version.sh "$LEVEL")"
            else
              VERSION="$INPUT_VERSION"
            fi
          else
            TAG_PUSH=true
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be MAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi
          if [ "$TAG_PUSH" = false ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
          # Below 1.0.0 the release is a pre-release whatever the box says, so
          # the appcast item lands on the beta channel.
          PRERELEASE=false
          if [ "${VERSION%%.*}" = "0" ] || [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "tag_push=$TAG_PUSH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen and create-dmg
        # scripts/bump-version.sh --apply regenerates Pipit.xcodeproj, so the
        # version commit carries the project the build was made from.
        # create-dmg lays out the installer window in scripts/package.sh.
        run: brew install xcodegen create-dmg

      - name: Write the version into the tree
        # VERSION, MARKETING_VERSION in project.yml, and the regenerated
        # Pipit.xcodeproj. The build below reads them. Nothing is pushed yet.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bump-version.sh --apply "$VERSION"

      - name: Check the update signing key
        # Sparkle refuses an update whose archive is unsigned, and the archive
        # is signed against the public key inside the app. A release built with
        # the placeholder ships a copy that can never update itself.
        run: |
          KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" App/Info.plist 2>/dev/null || true)"
          if [ -z "$KEY" ] || [ "$KEY" = "REPLACE_WITH_PUBLIC_KEY" ]; then
            echo "App/Info.plist still carries the placeholder SUPublicEDKey. Generate the EdDSA key pair and set the real public key before tagging a release. See docs/RELEASING.md." >&2
            exit 1
          fi

      - name: Look for a passing CI run on this commit
        id: ci
        # The gate is the CI run on main, which tests every commit before it
        # lands. When that run already passed on this exact commit, the test
        # step below repeats it and costs the job around half an hour, so it
        # is skipped. The name must match the job name in ci.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '.check_runs[] | select(.name == "Build and test" and .conclusion == "success") | .name' \
            | grep -q .; then
            tested=true
          fi
          echo "CI tested this commit: $tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Test before packaging
        # Only reached when no passing CI run exists for this commit, which in
        # practice means a tag pushed by hand onto an untested commit.
        if: steps.ci.outputs.tested != 'true'
        run: ./scripts/test.sh

      - name: Import the Developer ID certificate
        # Absent secrets are not a failure: the build still produces an ad-hoc
        # signed app, clearly marked as unsigned in the release notes.
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID certificate configured; building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          # A keychain relocks itself after five minutes idle. The release
          # build takes about that long, so the first codesign call then
          # waits on an unlock prompt nobody can answer and the job hangs
          # until its time limit. No timeout keeps it open for the job.
          security set-keychain-settings "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "certificate imported but no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sign the Firefox add-on
        # Absent credentials are not a failure: the app then ships without the
        # add-on and walks the user through about:debugging instead. Signing
        # that starts and fails is a failure, because a release that quietly
        # loses one-click install looks fine and is not.
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::No AMO credentials configured; shipping without the signed add-on."
            exit 0
          fi
          # Mozilla signs each add-on version once and refuses a repeat, so a
          # second run of the same release would fail here. The run number
          # makes every submission distinct while the app version stays the
          # first three parts. Firefox accepts up to four numeric parts.
          ./scripts/sign-extension.sh "$VERSION.$GITHUB_RUN_NUMBER"

      - name: Build the app
        # PIPIT_RELEASE asks scripts/app-version.sh for the plain version from
        # VERSION. Without it the bundle would read <VERSION>-dev.<short sha>,
        # which is what every other build carries. The build number comes from
        # the commit count and needs nothing here.
        env:
          PIPIT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PIPIT_RELEASE: '1'
        run: ./scripts/bundle-app.sh release

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize.sh dist/Pipit.app

      - name: Package
        run: ./scripts/package.sh ${{ steps.version.outputs.version }}

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Commit and tag the version
        # The build has already signed, notarized and packaged, so the tag only
        # ever names a tree that produced a release. The commit lands on the
        # default branch and the tag goes on that commit, which is why the
        # release step needs no target_commitish. A push made with GITHUB_TOKEN
        # does not start ci.yml. That is acceptable here. This tree is the
        # tested default branch plus the version files, and the test step above
        # ran against it. A tag push run skips this step, because its tag
        # already exists.
        if: steps.version.outputs.tag_push != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet HEAD -- VERSION project.yml Pipit.xcodeproj; then
            git add VERSION project.yml Pipit.xcodeproj
            git commit -m "Release $VERSION"
            # A pull request that merged while this job built moved the branch,
            # and the push would be rejected. Replay the version commit onto
            # what is there now. A conflict means the merge touched the version
            # files, so the run stops here and no tag is pushed.
            if ! git pull --rebase origin "$BRANCH"; then
              echo "cannot rebase the version commit onto $BRANCH: a change that landed during this run conflicts with VERSION, project.yml or Pipit.xcodeproj. Resolve it and run the release again." >&2
              git rebase --abort || true
              exit 1
            fi
            git push origin "HEAD:$BRANCH" || git push origin "HEAD:$BRANCH"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish the release
        # Pinned to a commit: this job holds the signing identity while it runs.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The signed add-on rides along so the Firefox update feed can point
          # at it. Absent when no AMO credentials were configured, which the
          # signing step already warned about.
          files: |
            dist/Pipit-${{ steps.version.outputs.version }}.zip
            dist/Pipit.dmg
            dist/Pipit-${{ steps.version.outputs.version }}.sha256
            extension/signed/pipit-sensor.xpi
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          # GitHub appends the notes it generates from merged pull requests
          # after this body.
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}
            ${{ steps.signing.outputs.signed != 'true' && '**Unsigned build.** Gatekeeper refuses it. Do not publish. See docs/RELEASING.md.' || '' }}
