name: Slow tests

# The suites tagged .slow (see scripts/slow-suites.sh) take most of a full test
# run. For a pull request they run here, as a check that is not required for
# the merge, and only when the change can reach them. A push to main runs them
# in ci.yml, where they must pass before a release is cut from the commit.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Choose the slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.pick.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the slow suites run
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          slow="$(git diff --name-only "$BASE_SHA"...HEAD | ./scripts/needs-slow-tests.sh)"
          echo "slow suites: $slow"
          echo "slow=$slow" >> "$GITHUB_OUTPUT"

  slow-tests:
    name: Slow tests (not required)
    needs: changes
    if: ${{ needs.changes.outputs.slow == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PIPIT_WARNINGS_AS_ERRORS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Run the slow tests
        # The suites tagged .slow run the echo canceller and the processing
        # pipeline over seconds of speech.
        run: ./scripts/test.sh --slow
