name: Select the newest Xcode
description: Selects the newest Xcode on the runner image and reports its version.
outputs:
  xcode:
    description: First line of `xcodebuild -version` for the selected Xcode
    value: ${{ steps.select.outputs.xcode }}
runs:
  using: composite
  steps:
    - name: Select the newest Xcode on the image
      id: select
      shell: bash
      # The SpeechAnalyzer backend needs the macOS 26 SDK to compile in.
      # The code carries its own compile gate, so an image without a new
      # enough Xcode still builds; it just builds without the Apple engine,
      # and a release from such a toolchain would ship without it too.
      run: |
        newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
        echo "selecting $newest"
        sudo xcode-select -s "$newest"
        echo "xcode=$(xcodebuild -version | head -1)" >> "$GITHUB_OUTPUT"
